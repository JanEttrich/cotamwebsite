<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Illustration: Außenansicht des Bistros Cô Tâm mit Markise, Laternen und Hockern</title>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D58C"/>
      <stop offset="1" stop-color="#E9B45C"/>
    </linearGradient>
    <pattern id="stripes" width="48" height="10" patternUnits="userSpaceOnUse">
      <rect width="24" height="10" fill="#5C5C34"/>
      <rect x="24" width="24" height="10" fill="#EEEEDF"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#E7E8D6"/>
  <!-- neighbouring walls -->
  <rect x="0" y="70" width="90" height="460" fill="#D5D6BF"/>
  <rect x="710" y="40" width="90" height="490" fill="#D5D6BF"/>
  <!-- facade -->
  <rect x="90" y="60" width="620" height="470" fill="#F3F1E4"/>
  <rect x="90" y="60" width="620" height="14" fill="#5C5C34"/>
  <!-- upper windows -->
  <g fill="#C9CBB0">
    <rect x="150" y="100" width="90" height="70" rx="4"/>
    <rect x="355" y="100" width="90" height="70" rx="4"/>
    <rect x="560" y="100" width="90" height="70" rx="4"/>
  </g>
  <g fill="#5C5C34" opacity=".55">
    <rect x="193" y="100" width="4" height="70"/><rect x="398" y="100" width="4" height="70"/><rect x="603" y="100" width="4" height="70"/>
  </g>
  <!-- sign band -->
  <rect x="120" y="196" width="560" height="64" rx="6" fill="#6B231A"/>
  <g transform="translate(400 228)" fill="none" stroke="#F3F1E4" stroke-width="3">
    <circle r="24"/>
    <path d="M-12 2 a12 10 0 0 0 24 0 z" fill="#F3F1E4" stroke="none"/>
    <path d="M-12 -6 L0 -18 L12 -6 z" fill="#F3F1E4" stroke="none"/>
    <path d="M6 -4 l10 -12 M9 -2 l10 -12" stroke-width="2"/>
  </g>
  <g fill="#F3F1E4">
    <rect x="160" y="224" width="170" height="8" rx="4" opacity=".9"/>
    <rect x="470" y="224" width="170" height="8" rx="4" opacity=".9"/>
  </g>
  <!-- awning -->
  <path d="M110 268 H690 L720 330 H80 Z" fill="url(#stripes)"/>
  <path d="M80 330 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 z" fill="#5C5C34"/>
  <!-- shop windows -->
  <rect x="130" y="356" width="200" height="150" rx="4" fill="url(#glow)"/>
  <rect x="470" y="356" width="200" height="150" rx="4" fill="url(#glow)"/>
  <g fill="#5C5C34" opacity=".75">
    <!-- bowls & plant silhouettes inside -->
    <path d="M160 470 a26 18 0 0 0 52 0 z"/><rect x="176" y="488" width="20" height="5" rx="2"/>
    <path d="M240 470 a26 18 0 0 0 52 0 z"/><rect x="256" y="488" width="20" height="5" rx="2"/>
    <path d="M520 470 a26 18 0 0 0 52 0 z"/><rect x="536" y="488" width="20" height="5" rx="2"/>
    <path d="M630 500 v-40 m0 10 q-18 -10 -22 -28 q18 6 22 22 m0 -6 q16 -12 20 -30 q-14 8 -20 24"/>
  </g>
  <path d="M190 456 q-4 -12 4 -22 M266 456 q-4 -12 4 -22 M546 456 q-4 -12 4 -22" stroke="#FFF7E2" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
  <rect x="130" y="356" width="200" height="150" rx="4" fill="none" stroke="#5C5C34" stroke-width="6"/>
  <rect x="470" y="356" width="200" height="150" rx="4" fill="none" stroke="#5C5C34" stroke-width="6"/>
  <!-- door -->
  <rect x="356" y="350" width="88" height="180" rx="4" fill="#5C5C34"/>
  <rect x="368" y="364" width="64" height="90" rx="3" fill="url(#glow)"/>
  <circle cx="430" cy="460" r="4" fill="#E9B45C"/>
  <!-- lanterns -->
  <g>
    <line x1="150" y1="338" x2="150" y2="352" stroke="#3A3A20" stroke-width="2"/>
    <ellipse cx="150" cy="372" rx="17" ry="21" fill="#6B231A"/><rect x="142" y="349" width="16" height="5" fill="#C9A15B"/><rect x="142" y="390" width="16" height="5" fill="#C9A15B"/><path d="M150 395 v14" stroke="#C9A15B" stroke-width="3"/>
    <line x1="650" y1="338" x2="650" y2="352" stroke="#3A3A20" stroke-width="2"/>
    <ellipse cx="650" cy="372" rx="17" ry="21" fill="#6B231A"/><rect x="642" y="349" width="16" height="5" fill="#C9A15B"/><rect x="642" y="390" width="16" height="5" fill="#C9A15B"/><path d="M650 395 v14" stroke="#C9A15B" stroke-width="3"/>
  </g>
  <!-- pavement -->
  <rect x="0" y="530" width="800" height="70" fill="#B9BB9C"/>
  <rect x="0" y="530" width="800" height="6" fill="#9FA182"/>
  <!-- Saigon street stools & table -->
  <g fill="#6B231A">
    <path d="M520 560 h40 l-6 34 h-6 l-4 -26 h-8 l-4 26 h-6 z"/>
    <path d="M610 560 h40 l-6 34 h-6 l-4 -26 h-8 l-4 26 h-6 z"/>
  </g>
  <g fill="#5C5C34"><rect x="555" y="540" width="70" height="8" rx="2"/><rect x="565" y="548" width="6" height="46"/><rect x="609" y="548" width="6" height="46"/></g>
  <!-- potted plants -->
  <g>
    <path d="M100 560 h44 l-6 36 h-32 z" fill="#6B231A"/>
    <path d="M122 560 q-30 -30 -18 -72 q20 30 18 72 q4 -50 30 -76 q2 46 -30 76" fill="#7A8040"/>
    <path d="M700 560 h44 l-6 36 h-32 z" fill="#6B231A"/>
    <path d="M722 560 q-26 -26 -20 -62 q18 26 20 62 q6 -40 28 -62 q0 40 -28 62" fill="#7A8040"/>
  </g>
</svg>
